name: Build Windows

# Gera o instalador e a versão portátil num runner Windows e publica numa Release do GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verificação estática dos scripts PowerShell
        run: npm run check

      - name: Compilar (.exe)
        run: npm run dist

      - name: Versão
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-boost-${{ steps.ver.outputs.version }}
          path: release/*.exe

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Windows Boost ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            **Windows Boost ${{ steps.ver.outputs.version }}** — otimizador para Windows 10/11, 100% local (sem login, sem licença, sem telemetria).

            - `WindowsBoost-Setup-${{ steps.ver.outputs.version }}.exe` — instalador
            - `WindowsBoost-Portatil-${{ steps.ver.outputs.version }}.exe` — versão portátil (não instala nada)

            O executável pede administrador ao abrir. Não é assinado digitalmente, então o Windows SmartScreen pode mostrar um aviso: clique em "Mais informações" → "Executar assim mesmo".

            Compilado a partir do commit ${{ github.sha }}.
          files: release/*.exe
